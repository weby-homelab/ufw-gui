services:
  ufw-gui:
    image: webyhomelab/ufw-gui:latest
    container_name: ufw-gui
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    environment:
      - TZ=Europe/Kyiv
      - PORT=8080
      - UFW_GUI_BIND_ADDRESS=${UFW_GUI_BIND_ADDRESS:-127.0.0.1}
      - UFW_GUI_SECRET_KEY=${UFW_GUI_SECRET_KEY:?Set UFW_GUI_SECRET_KEY in .env}
      - UFW_GUI_SETUP_TOKEN=${UFW_GUI_SETUP_TOKEN:-}
    volumes:
      - ./data:/app/data
      - /etc/ufw:/etc/ufw
      - /var/run/fail2ban/fail2ban.sock:/var/run/fail2ban/fail2ban.sock
      - /var/log:/var/log:ro
      - /etc/localtime:/etc/localtime:ro
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
