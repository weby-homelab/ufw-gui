name: CI (Lint and Build)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.2
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Show Ruff configuration
        run: |
          ruff --version
          ruff check --show-settings backend/main.py

      - name: Inspect safe Ruff fixes
        run: |
          status=0
          ruff check --fix --diff backend/ > /tmp/ruff-safe.patch || status=$?
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          echo "BEGIN_RUFF_SAFE_PATCH"
          cat /tmp/ruff-safe.patch
          echo "END_RUFF_SAFE_PATCH"

      - name: Lint with Ruff
        run: ruff check backend/

      - name: Check Python Compilation
        run: python -m py_compile backend/*.py backend/*/*.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
