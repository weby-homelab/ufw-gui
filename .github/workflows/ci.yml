name: CI (Lint and Build)

on:
  pull_request:
    branches:
      - main
      - fix/release-preserve-docker-tags

permissions:
  contents: read

jobs:
  backend-ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.2
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Show Ruff configuration
        run: |
          ruff --version
          ruff check --show-settings backend/main.py

      - name: Lint with Ruff
        run: ruff check backend/

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run backend tests
        env:
          UFW_GUI_SECRET_KEY: temporary-ci-only-secret-key-123456789
        run: python -m unittest discover -s tests -v

  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check Python Compilation
        run: python -m py_compile backend/*.py backend/*/*.py

  # Preserve the existing required-check context while reporting the three
  # independent results. A failed or skipped dependency must fail this gate.
  backend-lint:
    if: ${{ always() }}
    needs: [backend-ruff, backend-tests, backend-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Require all backend checks
        if: ${{ needs.backend-ruff.result != 'success' || needs.backend-tests.result != 'success' || needs.backend-compile.result != 'success' }}
        run: exit 1

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts
        working-directory: frontend

      - name: Typecheck frontend
        run: ./node_modules/.bin/tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
