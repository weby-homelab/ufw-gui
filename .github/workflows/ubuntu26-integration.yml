name: Ubuntu 26 Docker and host UFW integration
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable candidate commit SHA (review before dispatch)
        required: true
        type: string
permissions:
  contents: read
jobs:
  host-ufw:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - name: Validate immutable candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -eu
          case "$CANDIDATE_SHA" in
            *[!0-9a-f]*|'') echo "candidate_sha must be a full lowercase commit SHA" >&2; exit 1 ;;
          esac
          test "${#CANDIDATE_SHA}" -eq 40
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify checkout matches requested SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Prepare disposable host
        run: |
          cat /etc/os-release
          docker version
          sudo apt-get update
          sudo apt-get install -y ufw
          sudo ufw default allow incoming
          sudo ufw default allow outgoing
          sudo ufw --force enable
          sudo ufw allow 49151/tcp
          sudo ufw status verbose
      - name: Build image
        run: docker build -t ufw-gui-ci "$GITHUB_WORKSPACE/candidate"
      - name: Initialize isolated application storage
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/ufw-gui-data"
          docker run --rm \
            -v "$RUNNER_TEMP/ufw-gui-data:/app/data" \
            ufw-gui-ci python -m backend.initialize_storage
      - name: Start application against host firewall
        run: |
          set -eu
          export UFW_GUI_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          docker run -d --name ufw-gui-ci --network host --cap-add NET_ADMIN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID -e PORT=18081 --env UFW_GUI_SECRET_KEY -v "$RUNNER_TEMP/ufw-gui-data:/app/data" -v /etc/ufw:/etc/ufw ufw-gui-ci
          unset UFW_GUI_SECRET_KEY
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18081/api/health && exit 0; sleep 2; done
          exit 1
      - name: Verify authentication and host rule round trip
        run: |
          set -eu
          base=http://127.0.0.1:18081
          for endpoint in \
            'GET /api/status' 'GET /api/rules' 'POST /api/toggle' 'POST /api/rule' \
            'DELETE /api/rule/1' 'POST /api/ban' 'POST /api/reload' \
            'GET /api/auth/me' 'GET /api/audit-logs' 'GET /api/users' \
            'POST /api/users' 'DELETE /api/users/test' 'GET /api/settings' \
            'POST /api/settings' 'GET /api/snapshots/all' 'POST /api/snapshots/restore/test' \
            'GET /api/fail2ban/status' 'POST /api/fail2ban/unban' 'GET /api/logs' \
            'GET /api/stats' 'POST /api/reload/test' 'POST /api/reload/confirm'; do
            method=${endpoint%% *}
            path=${endpoint#* }
            status=$(curl -s -o /dev/null -w '%{http_code}' -X "$method" -H 'Content-Type: application/json' -d '{}' "$base$path")
            test "$status" = 401 || { echo "Unexpected unauthenticated response: $method $path -> $status"; exit 1; }
          done
          curl -fsS -H 'Content-Type: application/json' -d '{"username":"ciadmin","password":"temporary-test-password"}' "$base/api/auth/setup"
          test "$(curl -s -o /dev/null -w '%{http_code}' -d 'username=ciadmin&password=wrong' "$base/api/auth/login")" = 401
          token=$(curl -fsS -d 'username=ciadmin&password=temporary-test-password' "$base/api/auth/login" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          curl -fsS -H "Authorization: Bearer $token" "$base/api/auth/me" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["username"] == "ciadmin" and d["role"] == "superadmin"'
          curl -fsS -H "Authorization: Bearer $token" "$base/api/users" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "ciadmin" in str(d)'
          test "$(curl -s -o /tmp/test-mode-response -w '%{http_code}' -X POST -H "Authorization: Bearer $token" "$base/api/reload/test")" = 503
          python3 -c 'import json; assert "rollback" in json.load(open("/tmp/test-mode-response"))["detail"]'
          curl -fsS -H "Authorization: Bearer $token" "$base/api/status" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "running"'
          curl -fsS -H "Authorization: Bearer $token" "$base/api/rules" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any("49151/tcp" in r["to"] for r in d["rules"]), d'
          curl -fsS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"action":"allow","port":"49152","proto":"tcp","ip":""}' "$base/api/rule"
          sudo ufw status numbered | tee /tmp/ufw-ci-status
          grep -q '49152/tcp' /tmp/ufw-ci-status
          rule_id=$(curl -fsS -H "Authorization: Bearer $token" "$base/api/rules" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(r["id"] for r in d["rules"] if "49152/tcp" in r["to"]))')
          curl -fsS -X DELETE -H "Authorization: Bearer $token" "$base/api/rule/$rule_id"
          sudo ufw status numbered | tee /tmp/ufw-ci-after-delete
          ! grep -q "49152/tcp" /tmp/ufw-ci-after-delete
          grep -q "49151/tcp" /tmp/ufw-ci-after-delete
      - name: Verify disabled snapshot restore preserves firewall files
        run: |
          set -eu
          sudo sha256sum /etc/ufw/user.rules > /tmp/ufw-snapshot-before
          docker exec -i ufw-gui-ci python - <<'PY'
          import asyncio
          import os
          from fastapi import HTTPException
          from backend.services.database_service import init_db
          from backend.services.filesystem_service import restore_snapshot

          assert os.path.ismount("/etc/ufw")
          init_db()
          try:
              asyncio.run(restore_snapshot("ci-snapshot"))
          except HTTPException as exc:
              assert exc.status_code == 503
              assert "snapshot_restore_unavailable" in exc.detail
          else:
              raise AssertionError("snapshot restoration was not disabled")
          PY
          sudo sha256sum --check /tmp/ufw-snapshot-before
      - name: Verify legacy recovery evidence survives restart without rollback
        run: |
          set -eu
          sudo sha256sum /etc/ufw/user.rules > /tmp/ufw-rules-before
          docker exec ufw-gui-ci python -c 'import json, os, shutil; assert os.path.ismount("/etc/ufw"); p="/app/data/ufw_backups/test_rollback_config"; shutil.copytree("/etc/ufw",p,dirs_exist_ok=True); open(os.path.join(p,"ci-evidence"),"wb").write(b"preserve legacy evidence\n"); json.dump({"status":"testing"},open("/app/data/test_state.json","w"))'
          docker restart ufw-gui-ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:18081/api/health && break; sleep 2; done
          docker exec ufw-gui-ci python -c 'import json; assert json.load(open("/app/data/test_state.json"))["status"] == "testing"'
          docker exec ufw-gui-ci python -c 'from pathlib import Path; assert Path("/app/data/ufw_backups/test_rollback_config/ci-evidence").read_bytes() == b"preserve legacy evidence\n"'
          sudo sha256sum --check /tmp/ufw-rules-before
      - if: always()
        run: docker logs ufw-gui-ci || true
      - if: always()
        run: |
          docker rm -f ufw-gui-ci >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/ufw-gui-data"
